<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="gold" x1="18" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset="0.45" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#A87B00"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="48" y1="20" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D76E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C99400" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="28" y1="40" x2="48" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4A017" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6B4F00" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="48" y1="40" x2="72" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0B90B" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8A6500" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="core" cx="48" cy="46" r="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6D0"/>
      <stop offset="0.4" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#F0B90B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base plate -->
  <rect width="96" height="96" rx="22" fill="#0A0D12"/>
  <rect x="2.5" y="2.5" width="91" height="91" rx="20" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Isometric crystal / prism (N mark) -->
  <g filter="url(#soft)">
    <!-- top -->
    <path d="M48 22 L70 36 L48 50 L26 36 Z" fill="url(#faceTop)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- left -->
    <path d="M26 36 L48 50 L48 74 L26 60 Z" fill="url(#faceLeft)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- right -->
    <path d="M48 50 L70 36 L70 60 L48 74 Z" fill="url(#faceRight)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- inner N ridge -->
    <path d="M36 54 L42 42 L48 52 L54 38 L60 54" fill="none" stroke="#FFF3C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="48" cy="46" r="3.2" fill="#FFF8E0"/>
    <circle cx="48" cy="46" r="10" fill="url(#core)" opacity="0.55"/>
  </g>
  <!-- Baseline -->
  <path d="M24 80 H72" stroke="#1E2329" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 80 H64" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
