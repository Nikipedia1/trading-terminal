name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Stability · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # --- Stability gates (fail fast) ---
      - name: Assert no panel placeholders
        run: npm run assert:placeholders

      - name: Assert WidgetKind → PanelGrid coverage
        run: npm run assert:widgets

      # --- Compile: fails if any panel/module does not typecheck ---
      - name: Typecheck (panels must compile)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + desk smoke tests
        run: npm test

      - name: Production build (Pages dist)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''

      - name: Assert dist output
        run: |
          test -d dist
          test -f dist/index.html
          echo "dist OK ($(du -sh dist | cut -f1))"
